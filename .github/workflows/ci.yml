name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  geospatial-smoke:
    name: Geospatial smoke on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
          - windows-latest

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up micromamba geospatial environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: hics-ci
          init-shell: bash
          condarc: |
            channels:
              - conda-forge
            channel_priority: strict
          create-args: >-
            python=3.12
            gdal
            libspatialindex
            pip
            uv

      - name: Install Python package dependencies
        run: uv pip install --system ".[geo]"

      - name: Build package
        run: uv build

      - name: Smoke test package and GDAL imports
        run: python -c "import hics; from osgeo import gdal; print(gdal.VersionInfo('--version'))"
